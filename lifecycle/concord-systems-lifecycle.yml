source: https://github.com/concord
status: discontinued
summary: >-
  Concord Systems (Brooklyn, NY; founded December 2014 by Alexander Gallego and
  Emilio Del Tesoro) built a high-performance distributed stream processing
  framework in C++ on Apache Mesos. It was acquired by Akamai Technologies in
  September 2016 and the product was folded into Akamai's IoT edge data platform.
  The concord.io domain no longer belongs to the company (parked / listed for sale
  via GoDaddy) and the developer documentation at concord.io/docs is gone. The only
  surviving first-party developer surface is the github.com/concord organization
  and the client libraries still published on PyPI, RubyGems and pkg.go.dev.
