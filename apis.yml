name: Concord Systems
description: >-
  Concord Systems was a Brooklyn, New York stream-processing company founded in
  December 2014 by Alexander Gallego and Emilio Del Tesoro, and backed by Bloomberg
  Beta. It built a high-performance distributed stream processing framework written
  in C++ on top of Apache Mesos, aimed at letting application developers and data
  scientists write real-time streaming computations ("operators") in the language of
  their choice — Python, Ruby, Go, Java/Scala, Node.js or Haskell — with Kafka and
  Amazon Kinesis connectors and a CLI for deploying topologies. Akamai Technologies
  acquired the company in an all-cash transaction in September 2016 and folded the
  technology into its IoT edge data platform for real-time messaging and log
  processing. The company is discontinued: concord.io is parked and the documentation
  site is gone. Its interface was a Thrift-based operator driver API rather than an
  HTTP/REST API, so there is no OpenAPI or event surface to catalog; the surviving
  first-party developer artifacts are the github.com/concord organization and the
  client libraries still published on PyPI, RubyGems and pkg.go.dev.
